[project]
name = "melodi-mcp"
version = "0.1.0"
description = "MCP server exposing the INSEE MELODI dataset catalogue, modalities and observations"
requires-python = ">=3.12"
# Direct dependencies and their source: FastMCP (`server.py`, `tools/`); the core's
# Elasticsearch extra (`lifespan.py`, `services/index_service.py`); httpx (`lifespan.py`,
# `services/api_service.py`); and pydantic (`models.py`). No HTML parsing libraries are needed.
# The exact httpx pin deliberately constrains the tested observations-client runtime.
dependencies = [
    "diffusion-mcp-core[elasticsearch]",
    "fastmcp>=4.0.0",
    "httpx==0.28.1",
    "pydantic>=2.12.0",
]

[tool.uv.sources]
diffusion-mcp-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/melodi_mcp"]
