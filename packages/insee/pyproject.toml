[project]
name = "insee-mcp"
version = "0.1.0"
description = "MCP server exposing INSEE publications, rapid releases and key figures from insee.fr"
requires-python = ">=3.12"
# Direct dependencies and their source: FastMCP (`server.py`, `tools/`); the core's
# Elasticsearch extra (`lifespan.py`, `services/index_service.py`); httpx (`lifespan.py`,
# `services/document_service.py`); Beautiful Soup, Trafilatura, and the lxml parser backend
# (`services/document_service.py`). `"lxml"` is the parser name passed to BeautifulSoup, so
# lxml must be a direct dependency even though the module is not imported by name.
# Exact pins below deliberately constrain the tested HTTP and document-parsing runtime.
dependencies = [
    "beautifulsoup4==4.15.0",
    "diffusion-mcp-core[elasticsearch]",
    "fastmcp>=4.0.0",
    "httpx==0.28.1",
    "lxml==6.1.2",
    "pydantic>=2.12.0",
    "trafilatura==2.2.0",
]

[tool.uv.sources]
diffusion-mcp-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insee_mcp"]
