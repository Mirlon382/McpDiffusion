[project]
name = "mcpdiffusion"
version = "0.1.0"
description = "Aggregate MCP server: the three INSEE bricks assembled into one process"
requires-python = ">=3.12"
# Direct imports: `diffusion-mcp-core` and FastMCP in `src/mcpdiffusion/server.py` and
# `src/mcpdiffusion/assembly.py`; the three brick packages in `assembly.py`. Source-specific
# clients and their dependencies belong to the bricks. The Elasticsearch extra belongs to the
# INSEE and MELODI bricks, not this aggregate. FastMCP's server extra supplies Starlette >=1.0.1;
# this aggregate imports no Starlette API and needs no direct pin.
dependencies = [
    "diffusion-mcp-core",
    "fastmcp>=4.0.0",
    "insee-mcp",
    "melodi-mcp",
    "rmes-mcp",
]

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/insee",
    "packages/melodi",
    "packages/rmes",
]

[tool.uv.sources]
diffusion-mcp-core = { workspace = true }
insee-mcp = { workspace = true }
melodi-mcp = { workspace = true }
rmes-mcp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpdiffusion"]

[dependency-groups]
# pytest is imported by the test suite; pytest-asyncio supplies its asyncio auto mode.
# pre-commit and Ruff are developer CLI tools, not runtime imports.
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pre-commit>=4.5.1",
    "ruff>=0.15.4",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# B904 is off: Python keeps the original exception either way, so `raise ... from exc` only changes the
# wording in a traceback. include_traceback on ErrorHandlingMiddleware is what makes causes recoverable.
ignore = ["B904"]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear - catches common bug patterns
    "UP", # pyupgrade - enforces modern syntax, including `str | None` over `Optional[str]`
    # Only the call-site rule of flake8-boolean-trap: a bare `True` in a call reads as nothing.
    # FBT001/FBT002 are left off because a tool's boolean parameter is a named field of its schema.
    "FBT003", # flake8-boolean-trap
]

[tool.ruff.lint.flake8-bugbear]
# B008 forbids calls in argument defaults, because a shared mutable would leak between calls.
# These two build a dependency marker, not a value: FastMCP resolves them per request, so the
# default is never what the function receives.
extend-immutable-calls = [
    "fastmcp.dependencies.Depends",
    "fastmcp.dependencies.CurrentContext",
]

[tool.ruff.lint.per-file-ignores]
# Long literal statistics, pending replacement by a live source.
"packages/insee/src/insee_mcp/data/indicators.py" = ["E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

